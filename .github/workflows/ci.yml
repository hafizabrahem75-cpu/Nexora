name: Nexora CI

on:
  push:
    branches: [main, "fix/**", "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck app packages and build API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck shared libraries
        run: pnpm run typecheck:libs
      - name: Typecheck API server
        run: pnpm --filter @workspace/api-server run typecheck
      - name: Typecheck mobile app
        run: pnpm --filter @workspace/mobile run typecheck
      - name: Build API server
        run: pnpm --filter @workspace/api-server run build
